<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Standalone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #111827;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 640px;
      background: #4ec0ca;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px #374151;
      overflow: hidden;
      border-radius: 12px;
    }
    @media (max-width: 440px) or (max-height: 660px) {
      #game-container {
        max-width: 100%;
        max-height: 100%;
        border-radius: 0;
        box-shadow: none;
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    #sound-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: transform 0.1s, background 0.2s;
    }
    #sound-btn:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: scale(1.08);
    }
    #sound-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <button id="sound-btn" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const soundBtn = document.getElementById('sound-btn');

      // Virtual Canvas Dimensions
      const V_WIDTH = 400;
      const V_HEIGHT = 600;
      const GROUND_HEIGHT = 90;
      const GROUND_Y = V_HEIGHT - GROUND_HEIGHT;

      // Audio setup (100% Web Audio API, zero external assets)
      let soundEnabled = true;
      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSound(type) {
        if (!soundEnabled) return;
        const actx = getAudioContext();
        if (!actx) return;

        const now = actx.currentTime;

        if (type === 'flap') {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'score') {
          const osc1 = actx.createOscillator();
          const osc2 = actx.createOscillator();
          const gain = actx.createGain();
          osc1.type = 'triangle';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(784, now); // G5
          osc2.frequency.setValueAtTime(1046, now + 0.08); // C6
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.setValueAtTime(0.25, now + 0.08);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.24);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(actx.destination);
          osc1.start(now);
          osc1.stop(now + 0.08);
          osc2.start(now + 0.08);
          osc2.stop(now + 0.25);
        } else if (type === 'hit') {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.18);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'die') {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.35);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        }
      }

      soundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      });

      // High DPI Canvas Scaling
      function resizeCanvas() {
        const container = canvas.parentElement;
        const width = container.clientWidth;
        const height = container.clientHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.resetTransform();
        ctx.scale((width / V_WIDTH) * dpr, (height / V_HEIGHT) * dpr);
      }
      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', resizeCanvas);

      // LocalStorage High Score
      let bestScore = 0;
      try {
        const saved = localStorage.getItem('flappy_standalone_best');
        if (saved !== null) bestScore = parseInt(saved, 10) || 0;
      } catch (err) {}

      function saveBestScore(score) {
        if (score > bestScore) {
          bestScore = score;
          try {
            localStorage.setItem('flappy_standalone_best', bestScore.toString());
          } catch (err) {}
        }
      }

      // Game States: 'START', 'PLAYING', 'GAMEOVER'
      let state = 'START';
      let score = 0;
      let frameCount = 0;
      let groundOffset = 0;
      let cloudsOffset = 0;
      let cityOffset = 0;
      let screenShake = 0;
      let screenFlash = 0;

      // Particle system for flaps & dust
      const particles = [];
      function addParticle(x, y, vx, vy, color, radius, life) {
        particles.push({ x, y, vx, vy, color, radius, life, maxLife: life });
      }

      // Bird Object
      const bird = {
        x: 95,
        y: 260,
        radius: 14,
        vy: 0,
        gravity: 0.38,
        jumpForce: -6.8,
        rotation: 0,
        wingTimer: 0,
        wingState: 0,

        reset() {
          this.x = 95;
          this.y = 260;
          this.vy = 0;
          this.rotation = 0;
          this.wingTimer = 0;
          this.wingState = 0;
        },

        flap() {
          this.vy = this.jumpForce;
          playSound('flap');
          // Emit feather/air puffs
          for (let i = 0; i < 4; i++) {
            addParticle(
              this.x - 12 + (Math.random() * 4 - 2),
              this.y + 6 + (Math.random() * 4 - 2),
              -1.5 - Math.random() * 1.5,
              Math.random() * 2 - 1,
              'rgba(255, 255, 255, 0.7)',
              3.5,
              18
            );
          }
        },

        update() {
          if (state === 'START') {
            // Gentle hovering
            this.y = 260 + Math.sin(frameCount * 0.08) * 8;
            this.rotation = 0;
            this.wingTimer++;
            if (this.wingTimer % 6 === 0) {
              this.wingState = (this.wingState + 1) % 3;
            }
            return;
          }

          // Active physics
          this.vy += this.gravity;
          this.y += this.vy;

          // Rotation interpolation based on vertical speed
          if (this.vy < 0) {
            // Tilted up when jumping
            this.rotation = Math.max(-0.48, -0.48 * (-this.vy / 6.8));
          } else {
            // Smoothly dip downward when falling
            this.rotation = Math.min(Math.PI / 2, this.rotation + 0.05);
          }

          // Wing flapping logic
          if (this.vy < 2) {
            this.wingTimer++;
            if (this.wingTimer % 4 === 0) {
              this.wingState = (this.wingState + 1) % 3;
            }
          } else {
            this.wingState = 1; // Gliding downwards
          }

          // Ground collision
          if (this.y + this.radius >= GROUND_Y) {
            this.y = GROUND_Y - this.radius;
            triggerGameOver();
          }

          // Ceiling boundary
          if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.vy = 0;
          }
        },

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);

          // Shadow beneath bird
          ctx.beginPath();
          ctx.ellipse(0, 16, 12, 5, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
          ctx.fill();

          // Bird Main Body (Vibrant Yellow-Gold)
          ctx.beginPath();
          ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#facc15';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#854d0e';
          ctx.stroke();

          // Belly highlight (Peach / light cream)
          ctx.beginPath();
          ctx.ellipse(-2, 4, 10, 7, -0.1, 0, Math.PI * 2);
          ctx.fillStyle = '#fef08a';
          ctx.fill();

          // Wing
          ctx.save();
          ctx.translate(-5, 0);
          let wingOffsetY = 0;
          let wingAngle = 0;
          if (this.wingState === 0) {
            wingOffsetY = -4;
            wingAngle = -0.3;
          } else if (this.wingState === 2) {
            wingOffsetY = 4;
            wingAngle = 0.3;
          }
          ctx.rotate(wingAngle);
          ctx.beginPath();
          ctx.ellipse(0, wingOffsetY, 9, 6, -0.2, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#ca8a04';
          ctx.stroke();
          ctx.restore();

          // Cheek blush
          ctx.beginPath();
          ctx.arc(4, 4, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(249, 115, 22, 0.45)';
          ctx.fill();

          // Eye (Large white cartoon eye)
          ctx.beginPath();
          ctx.arc(8, -4, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#451a03';
          ctx.stroke();

          // Eye pupil & gleam
          ctx.beginPath();
          ctx.arc(9.5, -4, 2.3, 0, Math.PI * 2);
          ctx.fillStyle = '#0f172a';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(10.5, -5.2, 1, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();

          // Beak (Rich bright orange)
          ctx.beginPath();
          ctx.moveTo(11, -1);
          ctx.lineTo(20, 2);
          ctx.lineTo(11, 6);
          ctx.closePath();
          ctx.fillStyle = '#ea580c';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#7c2d12';
          ctx.stroke();

          // Beak slit line
          ctx.beginPath();
          ctx.moveTo(11, 2);
          ctx.lineTo(18, 2);
          ctx.strokeStyle = '#7c2d12';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.restore();
        }
      };

      // Pipes Manager
      const PIPE_WIDTH = 64;
      const PIPE_CAP_HEIGHT = 26;
      const PIPE_CAP_OVERHANG = 3;
      const GAP_SIZE = 142;
      let pipes = [];
      let pipeSpawnTimer = 0;
      let currentSpeed = 2.4;

      function spawnPipe() {
        const minHeight = 60;
        const maxHeight = GROUND_Y - GAP_SIZE - minHeight;
        const topHeight = Math.floor(minHeight + Math.random() * (maxHeight - minHeight));
        const bottomY = topHeight + GAP_SIZE;

        pipes.push({
          x: V_WIDTH + 10,
          topHeight: topHeight,
          bottomY: bottomY,
          passed: false
        });
      }

      function updatePipes() {
        // Difficulty scaling: speed increases with score
        currentSpeed = Math.min(4.6, 2.4 + Math.floor(score / 5) * 0.16);

        pipeSpawnTimer++;
        // Spawn every ~120 frames at base speed, scaled with speed
        const interval = Math.max(76, Math.floor(125 * (2.4 / currentSpeed)));
        if (pipeSpawnTimer >= interval) {
          spawnPipe();
          pipeSpawnTimer = 0;
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= currentSpeed;

          // Score check
          if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
            p.passed = true;
            score++;
            saveBestScore(score);
            playSound('score');
          }

          // Collision Check
          if (checkPipeCollision(bird, p)) {
            triggerGameOver();
          }

          // Remove off-screen pipes
          if (p.x + PIPE_WIDTH + 20 < 0) {
            pipes.splice(i, 1);
          }
        }
      }

      function checkPipeCollision(b, p) {
        // Precise circle-box intersection with 2px margin for fairness
        const bLeft = b.x - b.radius + 2;
        const bRight = b.x + b.radius - 2;
        const bTop = b.y - b.radius + 2;
        const bBottom = b.y + b.radius - 2;

        const pLeft = p.x;
        const pRight = p.x + PIPE_WIDTH;

        // Horizontally within pipe bounds
        if (bRight > pLeft && bLeft < pRight) {
          // Top pipe collision
          if (bTop < p.topHeight) return true;
          // Bottom pipe collision
          if (bBottom > p.bottomY) return true;
        }
        return false;
      }

      function drawPipes() {
        for (const p of pipes) {
          // --- TOP PIPE ---
          const topBodyHeight = p.topHeight - PIPE_CAP_HEIGHT;

          // Top Pipe Body
          drawPipeCylinder(p.x, 0, PIPE_WIDTH, topBodyHeight);

          // Top Pipe Cap (Bottom of top pipe)
          drawPipeCap(
            p.x - PIPE_CAP_OVERHANG,
            topBodyHeight,
            PIPE_WIDTH + PIPE_CAP_OVERHANG * 2,
            PIPE_CAP_HEIGHT
          );

          // --- BOTTOM PIPE ---
          const bottomCapY = p.bottomY;
          const bottomBodyY = p.bottomY + PIPE_CAP_HEIGHT;
          const bottomBodyHeight = GROUND_Y - bottomBodyY;

          // Bottom Pipe Cap
          drawPipeCap(
            p.x - PIPE_CAP_OVERHANG,
            bottomCapY,
            PIPE_WIDTH + PIPE_CAP_OVERHANG * 2,
            PIPE_CAP_HEIGHT
          );

          // Bottom Pipe Body
          drawPipeCylinder(p.x, bottomBodyY, PIPE_WIDTH, bottomBodyHeight);
        }
      }

      // Classic Retro Green Pipe Renderer with Highlights & Shading
      function drawPipeCylinder(x, y, w, h) {
        if (h <= 0) return;

        // Gradient for 3D metallic-pipe look
        const grad = ctx.createLinearGradient(x, 0, x + w, 0);
        grad.addColorStop(0, '#53a826');
        grad.addColorStop(0.18, '#8de042');
        grad.addColorStop(0.45, '#56b823');
        grad.addColorStop(0.82, '#2f6e12');
        grad.addColorStop(1, '#1b4408');

        ctx.fillStyle = grad;
        ctx.fillRect(x, y, w, h);

        // Pipe outlines
        ctx.strokeStyle = '#143807';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);

        // Vertical highlight pinstripe
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fillRect(x + 7, y, 4, h);
      }

      function drawPipeCap(x, y, w, h) {
        const grad = ctx.createLinearGradient(x, 0, x + w, 0);
        grad.addColorStop(0, '#5ec72d');
        grad.addColorStop(0.18, '#9cf04b');
        grad.addColorStop(0.45, '#5fb823');
        grad.addColorStop(0.82, '#2f6e12');
        grad.addColorStop(1, '#1b4408');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x, y, w, h, 2) : ctx.rect(x, y, w, h);
        ctx.fill();

        ctx.strokeStyle = '#143807';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Lip highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(x + 8, y + 2, 4, h - 4);

        // Inner shadow on rim
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(x, y + h - 3, w, 2);
      }

      // Game Over Trigger
      function triggerGameOver() {
        if (state === 'GAMEOVER') return;
        state = 'GAMEOVER';
        screenShake = 16;
        screenFlash = 1.0;
        playSound('hit');
        setTimeout(() => {
          playSound('die');
        }, 120);

        // Dust impact particles
        for (let i = 0; i < 12; i++) {
          addParticle(
            bird.x,
            Math.min(bird.y + 10, GROUND_Y),
            (Math.random() - 0.5) * 6,
            -Math.random() * 4 - 1,
            '#e5d59f',
            Math.random() * 4 + 2,
            24
          );
        }
      }

      function resetGame() {
        state = 'START';
        score = 0;
        pipes = [];
        pipeSpawnTimer = 0;
        currentSpeed = 2.4;
        bird.reset();
      }

      // Input Handlers
      function handleAction() {
        getAudioContext();
        if (state === 'START') {
          state = 'PLAYING';
          bird.flap();
        } else if (state === 'PLAYING') {
          bird.flap();
        } else if (state === 'GAMEOVER') {
          // Restart game immediately
          resetGame();
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
          e.preventDefault();
          handleAction();
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleAction();
      });

      // Background Graphics & Parallax
      const clouds = [
        { x: 30, y: 70, scale: 1.1 },
        { x: 170, y: 130, scale: 0.8 },
        { x: 310, y: 60, scale: 1.2 },
        { x: 440, y: 110, scale: 0.9 }
      ];

      function drawClouds() {
        cloudsOffset = (cloudsOffset + (state === 'PLAYING' ? currentSpeed * 0.25 : 0.4)) % 400;

        for (const cloud of clouds) {
          let drawX = (cloud.x - cloudsOffset + 500) % 500 - 60;
          ctx.save();
          ctx.translate(drawX, cloud.y);
          ctx.scale(cloud.scale, cloud.scale);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
          ctx.beginPath();
          ctx.arc(0, 0, 20, 0, Math.PI * 2);
          ctx.arc(18, -8, 24, 0, Math.PI * 2);
          ctx.arc(42, -4, 20, 0, Math.PI * 2);
          ctx.arc(58, 4, 15, 0, Math.PI * 2);
          ctx.arc(28, 12, 18, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }
      }

      // City Skyline / Rolling Hills
      function drawCitySkyline() {
        cityOffset = (cityOffset + (state === 'PLAYING' ? currentSpeed * 0.45 : 0.6)) % 400;
        const baseSkylineY = GROUND_Y - 2;

        // Distant gentle rolling green hills
        ctx.fillStyle = '#8bd7b7';
        for (let x = -60; x <= V_WIDTH + 60; x += 110) {
          const hillX = ((x - cityOffset * 0.5) % (V_WIDTH + 140)) - 40;
          ctx.beginPath();
          ctx.arc(hillX + 60, baseSkylineY + 50, 80, Math.PI, 0);
          ctx.fill();
        }

        // Silhouette retro skyline buildings
        ctx.fillStyle = '#65b89a';
        const buildings = [
          { x: 10, w: 32, h: 65 },
          { x: 48, w: 24, h: 90 },
          { x: 78, w: 38, h: 50 },
          { x: 122, w: 28, h: 75 },
          { x: 156, w: 35, h: 105 },
          { x: 198, w: 26, h: 60 },
          { x: 230, w: 34, h: 85 },
          { x: 270, w: 40, h: 70 },
          { x: 316, w: 26, h: 95 },
          { x: 348, w: 36, h: 55 },
          { x: 390, w: 30, h: 80 }
        ];

        for (const b of buildings) {
          const bx = ((b.x - cityOffset + 440) % 440) - 30;
          ctx.fillRect(bx, baseSkylineY - b.h, b.w, b.h);

          // Tiny lit windows
          ctx.fillStyle = 'rgba(255, 255, 230, 0.4)';
          for (let wy = baseSkylineY - b.h + 8; wy < baseSkylineY - 8; wy += 14) {
            ctx.fillRect(bx + 4, wy, 4, 6);
            if (b.w > 26) ctx.fillRect(bx + b.w - 8, wy, 4, 6);
          }
          ctx.fillStyle = '#65b89a';
        }
      }

      // Ground Layer with Scrolling Stripe Texture
      function drawGround() {
        if (state === 'PLAYING') {
          groundOffset = (groundOffset + currentSpeed) % 24;
        } else if (state === 'START') {
          groundOffset = (groundOffset + 1.8) % 24;
        }

        // Ground upper grass band
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(0, GROUND_Y, V_WIDTH, 14);

        // Highlight stripe on top of grass
        ctx.fillStyle = '#9fe855';
        ctx.fillRect(0, GROUND_Y, V_WIDTH, 3);

        // Dark grass separator
        ctx.fillStyle = '#52941b';
        ctx.fillRect(0, GROUND_Y + 12, V_WIDTH, 2);

        // Main soil base
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, GROUND_Y + 14, V_WIDTH, GROUND_HEIGHT - 14);

        // Angled chevron dirt stripes
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, GROUND_Y + 14, V_WIDTH, GROUND_HEIGHT - 14);
        ctx.clip();

        ctx.fillStyle = '#c8bc73';
        const step = 20;
        for (let x = -30 - groundOffset; x < V_WIDTH + 40; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, GROUND_Y + 14);
          ctx.lineTo(x + 10, GROUND_Y + 14);
          ctx.lineTo(x - 6, GROUND_Y + GROUND_HEIGHT);
          ctx.lineTo(x - 16, GROUND_Y + GROUND_HEIGHT);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // Dark boundary border
        ctx.fillStyle = '#524b22';
        ctx.fillRect(0, GROUND_Y, V_WIDTH, 2);
      }

      // Floating Score Counter
      function drawScore() {
        if (state === 'PLAYING') {
          const scoreStr = score.toString();
          ctx.save();
          ctx.font = '900 48px "Impact", "Arial Black", sans-serif';
          ctx.textAlign = 'center';

          // Drop Shadow & Dark Outline
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          ctx.fillText(scoreStr, V_WIDTH / 2 + 2, 72);

          ctx.lineWidth = 5;
          ctx.strokeStyle = '#000000';
          ctx.strokeText(scoreStr, V_WIDTH / 2, 70);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(scoreStr, V_WIDTH / 2, 70);
          ctx.restore();
        }
      }

      // UI Screens
      function drawStartScreen() {
        ctx.save();
        ctx.textAlign = 'center';

        // Title: FLAPPY BIRD
        ctx.font = '900 44px "Impact", "Arial Black", sans-serif';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#27272a';
        ctx.strokeText('FLAPPY BIRD', V_WIDTH / 2, 140);
        ctx.fillStyle = '#facc15';
        ctx.fillText('FLAPPY BIRD', V_WIDTH / 2, 140);

        // Subtitle badge
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(V_WIDTH / 2 - 110, 155, 220, 26, 13) : ctx.rect(V_WIDTH / 2 - 110, 155, 220, 26);
        ctx.fill();

        ctx.font = '700 13px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CANVAS ARCADE EDITION', V_WIDTH / 2, 172);

        // Pulsing instruction badge
        const pulse = 1 + Math.sin(frameCount * 0.1) * 0.05;
        ctx.save();
        ctx.translate(V_WIDTH / 2, 390);
        ctx.scale(pulse, pulse);

        // Card container
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(-140, -32, 280, 64, 16) : ctx.rect(-140, -32, 280, 64);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = '900 18px sans-serif';
        ctx.fillStyle = '#78350f';
        ctx.fillText('PRESS SPACE OR CLICK', 0, -5);

        ctx.font = '700 13px sans-serif';
        ctx.fillStyle = '#451a03';
        ctx.fillText('TAP SCREEN TO FLAP', 0, 17);
        ctx.restore();

        // Best score badge
        if (bestScore > 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(V_WIDTH / 2 - 80, 455, 160, 30, 8) : ctx.rect(V_WIDTH / 2 - 80, 455, 160, 30);
          ctx.fill();

          ctx.font = '800 14px sans-serif';
          ctx.fillStyle = '#fde047';
          ctx.fillText(`BEST SCORE: ${bestScore}`, V_WIDTH / 2, 475);
        }

        ctx.restore();
      }

      function drawGameOverScreen() {
        ctx.save();
        ctx.textAlign = 'center';

        // Title banner
        ctx.font = '900 42px "Impact", "Arial Black", sans-serif';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#000000';
        ctx.strokeText('GAME OVER', V_WIDTH / 2, 140);
        ctx.fillStyle = '#ef4444';
        ctx.fillText('GAME OVER', V_WIDTH / 2, 140);

        // Score Card Box
        const cardX = 40;
        const cardY = 175;
        const cardW = 320;
        const cardH = 200;

        // Card Drop Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(cardX + 4, cardY + 6, cardW, cardH, 16) : ctx.rect(cardX + 4, cardY + 6, cardW, cardH);
        ctx.fill();

        // Card Main Body (Retro arcade parchment)
        ctx.fillStyle = '#ded895';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(cardX, cardY, cardW, cardH, 16) : ctx.rect(cardX, cardY, cardW, cardH);
        ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#543847';
        ctx.stroke();

        // Inner frame
        ctx.strokeStyle = '#c4b572';
        ctx.lineWidth = 2;
        ctx.strokeRect(cardX + 10, cardY + 10, cardW - 20, cardH - 20);

        // Medal Section
        ctx.textAlign = 'left';
        ctx.font = '900 14px sans-serif';
        ctx.fillStyle = '#b45309';
        ctx.fillText('MEDAL', cardX + 32, cardY + 44);

        // Draw Medal Emblem
        drawMedalBadge(cardX + 54, cardY + 105, score);

        // Score Display
        ctx.textAlign = 'right';
        ctx.font = '800 13px sans-serif';
        ctx.fillStyle = '#b45309';
        ctx.fillText('SCORE', cardX + cardW - 32, cardY + 44);

        ctx.font = '900 36px "Impact", sans-serif';
        ctx.fillStyle = '#0f172a';
        ctx.fillText(score.toString(), cardX + cardW - 32, cardY + 84);

        // High Score Display
        ctx.font = '800 13px sans-serif';
        ctx.fillStyle = '#b45309';
        ctx.fillText('BEST', cardX + cardW - 32, cardY + 124);

        ctx.font = '900 36px "Impact", sans-serif';
        ctx.fillStyle = '#0f172a';
        ctx.fillText(bestScore.toString(), cardX + cardW - 32, cardY + 164);

        // New High Score Ribbon
        if (score >= bestScore && score > 0) {
          ctx.save();
          ctx.translate(cardX + cardW - 110, cardY + 100);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-6, -10, 48, 18);
          ctx.font = '900 10px sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.fillText('NEW', 18, 3);
          ctx.restore();
        }

        // Restart Trigger Button
        ctx.textAlign = 'center';
        const btnY = 410;
        const btnW = 220;
        const btnH = 54;
        const btnX = V_WIDTH / 2 - btnW / 2;

        ctx.fillStyle = '#16a34a';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(btnX, btnY, btnW, btnH, 14) : ctx.rect(btnX, btnY, btnW, btnH);
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = '900 22px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PLAY AGAIN', V_WIDTH / 2, btnY + 34);

        // Helper hint
        ctx.font = '600 13px sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillText('Press Spacebar or Click anywhere', V_WIDTH / 2, 492);

        ctx.restore();
      }

      function drawMedalBadge(x, y, sc) {
        ctx.save();
        ctx.translate(x, y);

        let medalColor = '#94a3b8'; // default slate / none
        let ribbonColor = '#dc2626';
        let label = 'NONE';

        if (sc >= 40) {
          medalColor = '#38bdf8'; // Platinum
          ribbonColor = '#9333ea';
          label = 'PLAT';
        } else if (sc >= 30) {
          medalColor = '#facc15'; // Gold
          ribbonColor = '#dc2626';
          label = 'GOLD';
        } else if (sc >= 20) {
          medalColor = '#e2e8f0'; // Silver
          ribbonColor = '#2563eb';
          label = 'SILV';
        } else if (sc >= 10) {
          medalColor = '#d97706'; // Bronze
          ribbonColor = '#16a34a';
          label = 'BRNZ';
        }

        // Ribbon
        ctx.fillStyle = ribbonColor;
        ctx.beginPath();
        ctx.moveTo(-16, -34);
        ctx.lineTo(0, -14);
        ctx.lineTo(16, -34);
        ctx.lineTo(8, -34);
        ctx.lineTo(0, -22);
        ctx.lineTo(-8, -34);
        ctx.closePath();
        ctx.fill();

        // Medal Outer Coin
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.fillStyle = medalColor;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#78350f';
        ctx.stroke();

        // Inner ridge
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.stroke();

        // Sparkle or Star
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-6, -6, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '900 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#78350f';
        ctx.fillText(label, 0, 4);

        ctx.restore();
      }

      // Particles Update & Draw
      function updateAndDrawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          const alpha = p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Main Game Loop
      function loop() {
        frameCount++;

        // Update logic
        bird.update();
        if (state === 'PLAYING') {
          updatePipes();
        }

        // Camera Shake calculation
        let shakeX = 0;
        let shakeY = 0;
        if (screenShake > 0) {
          shakeX = (Math.random() - 0.5) * screenShake;
          shakeY = (Math.random() - 0.5) * screenShake;
          screenShake *= 0.85;
          if (screenShake < 0.5) screenShake = 0;
        }

        // Render pass
        ctx.save();
        ctx.translate(shakeX, shakeY);

        // Sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        skyGrad.addColorStop(0, '#4ec0ca');
        skyGrad.addColorStop(0.7, '#7cdbf2');
        skyGrad.addColorStop(1, '#bcf2fb');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, V_WIDTH, GROUND_Y);

        // Background layers
        drawClouds();
        drawCitySkyline();

        // Pipes
        drawPipes();

        // Ground (always in front of pipes)
        drawGround();

        // Particles
        updateAndDrawParticles();

        // Bird
        bird.draw();

        // UI layers
        drawScore();
        if (state === 'START') {
          drawStartScreen();
        } else if (state === 'GAMEOVER') {
          drawGameOverScreen();
        }

        // Screen Flash on Hit
        if (screenFlash > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash})`;
          ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
          screenFlash -= 0.12;
          if (screenFlash < 0) screenFlash = 0;
        }

        ctx.restore();

        requestAnimationFrame(loop);
      }

      // Initial Setup
      resizeCanvas();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
